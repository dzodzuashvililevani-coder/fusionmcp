[project]
name = "drone-wood-frame"
version = "0.1.0"
description = "Parametric wooden FPV drone frame - design tools, mass budget, and Fusion automation"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dxf = ["ezdxf>=1.3"]
dev = ["pytest>=8.0"]

[project.scripts]
frame = "frame_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_tools", "src/fcc"]
